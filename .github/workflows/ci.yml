name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        # One known error (set-state-in-effect in OutlineSummaries.tsx); shown, but doesn't fail the run.
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npx next build
      - name: Unit and API tests
        run: npm test
      - name: Browser tests
        # The runner's preinstalled Google Chrome.
        env:
          E2E_CHANNEL: chrome
        run: npm run test:e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: storytime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and check /api/health
        run: |
          docker run -d --name st -p 3737:3737 storytime:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3737/api/health; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs st
          exit 1
      - name: Publish to GitHub Container Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag storytime:ci "$image:latest"
          docker tag storytime:ci "$image:sha-${GITHUB_SHA::7}"
          docker push "$image:latest"
          docker push "$image:sha-${GITHUB_SHA::7}"
