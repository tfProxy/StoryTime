name: Build and publish image

# Builds the Docker image and publishes it to GitHub's container registry as
# ghcr.io/<owner>/<repo> (lower-cased), so servers can pull it instead of building.
#   - every push to main  -> :latest and :sha-<commit>
#   - a tag like v1.2.0   -> :1.2.0, :1.2 and :latest
# Pull requests only run the tests; nothing is published for them.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit and API tests (the browser tests need a desktop browser, so they stay local).
      # This also builds the app, which generates the route types the typecheck needs.
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The action lower-cases the name, as the registry requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
