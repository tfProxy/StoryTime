services:
  storytime:
    # The image GitHub Actions builds, tests and publishes on each push to main.
    # Update with `docker compose pull && docker compose up -d`. To go back to a version, use its
    # commit tag instead of latest (for example ghcr.io/tfproxy/storytime:sha-4afc91f).
    # To build from source instead, replace the image line with
    # `build: https://github.com/tfProxy/StoryTime.git#main` (or `build: .` in a checkout).
    image: ghcr.io/tfproxy/storytime:latest
    container_name: storytime
    ports:
      - "${STORYTIME_PORT:-3737}:3737"
    volumes:
      # Where the database lives. On Unraid use something like /mnt/user/appdata/storytime
      - ${STORYTIME_DATA:-./data}:/data
    restart: unless-stopped
